name: LibreSprite Android Mobile

on:
  workflow_dispatch:
  push:
    branches: [ "main", "mobile-android" ]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibreSprite with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libcurl4-gnutls-dev libfreetype6-dev libgif-dev libjpeg-dev libpixman-1-dev libpng-dev libsdl2-dev libsdl2-image-dev libtinyxml2-dev libx11-dev libxcursor-dev ninja-build zlib1g-dev libarchive-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install cmake

      - name: Generate LibreSprite native sources
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake -G Ninja -DGEN_ONLY=ON ..
          ninja

      - name: Fetch official Android dependencies
        run: |
          rm -rf android
          git clone --depth 1 https://github.com/LibreSprite/ls-android-deps.git android

      - name: Configure Android CMake path
        run: |
          CMAKEPATH=$(dirname $(dirname $(which cmake)))
          echo "cmake.dir=$CMAKEPATH" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --parallel --stacktrace build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreSprite-Android-Mobile-debug
          path: android/app/build/outputs/apk/all_in_one/debug/app-all_in_one-debug.apk
          if-no-files-found: error
